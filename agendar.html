<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vita · Agenda tu demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#016075;--teal-2:#0a7e96;--ink:#17262b;--ink-2:#4a5c62;--line:#dde5e7;--bg:#f3f6f6}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-size:16px;line-height:1.5}
.card{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:34px 30px 30px;box-shadow:0 18px 50px -22px rgba(1,60,73,.35)}
.brand{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--teal);margin-bottom:18px}
h1{font-size:24px;letter-spacing:-.015em;margin-bottom:6px}
.sub{color:var(--ink-2);font-size:15px;margin-bottom:22px}
label{display:block;font-size:13.5px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--teal)}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.hours button{height:44px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:600;cursor:pointer}
.hours button:hover{border-color:var(--teal)}
.hours button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.cta{margin-top:22px;width:100%;height:52px;border:0;border-radius:999px;background:linear-gradient(145deg,var(--teal-2),var(--teal));color:#fff;font:inherit;font-size:16.5px;font-weight:700;cursor:pointer}
.cta:disabled{opacity:.55;cursor:default}
.msg{margin-top:12px;font-size:14px;color:#b8433a;min-height:20px}
.done{text-align:center;padding:16px 0 6px}
.done .check{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--teal-2),var(--teal))}
.done h2{font-size:22px;margin-bottom:8px}
.done p{color:var(--ink-2);font-size:15px}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:#9aa8ad}
.foot b{color:var(--teal)}
[hidden]{display:none!important}
</style></head><body>
<div class="card">
  <div class="brand">VITA</div>
  <div id="pick">
    <h1>Agenda tu demo</h1>
    <p class="sub">30 minutos por videollamada con Andrés, de Vita. Elige el día y la hora que te acomoden.</p>
    <div id="emailWrap" hidden><label>Tu email</label><input type="email" id="email" placeholder="tu@centro.cl"></div>
    <label>Día</label><select id="day"><option value="">Cargando horas…</option></select>
    <label>Hora <span id="tz" style="font-weight:400;color:#9aa8ad">(hora de Chile)</span></label>
    <div class="hours" id="hours"></div>
    <button class="cta" id="go" disabled>Confirmar hora</button>
    <div class="msg" id="msg"></div>
  </div>
  <div id="done" class="done" hidden>
    <div class="check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2>Demo confirmada</h2>
    <p id="doneTxt"></p>
    <p style="margin-top:10px">Te llega la invitación al calendario y un correo con los detalles.</p>
  </div>
  <div class="foot"><b>Vita</b> · El equipo que opera tu centro wellness. · vita.lat · hola@vita.lat</div>
</div>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbzgOebpl4R4fWZ1ZC4ZG-0hdgaoCThcAAxaAsamalpJWfp3NMF5GDNab82pGbcKDnk3QQ/exec';
const qs=new URLSearchParams(location.search);
let EMAIL=(qs.get('email')||'').trim(),SLOTS=[],SEL='';
const day=document.getElementById('day'),hours=document.getElementById('hours'),go=document.getElementById('go'),msg=document.getElementById('msg');
if(!EMAIL)document.getElementById('emailWrap').hidden=false; else{const e=document.getElementById('email');e.value=EMAIL}
async function load(){
  try{
    const j=await (await fetch(ENDPOINT+'?slots=1')).json();SLOTS=j.slots||[];
    day.innerHTML='<option value="">Elige un día</option>';
    [...new Set(SLOTS.map(x=>x.day))].forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=SLOTS.find(x=>x.day===d).dayLabel;day.appendChild(o)});
    if(!SLOTS.length){day.innerHTML='<option value="">Sin horas disponibles</option>';msg.textContent='No hay horas libres estos días. Escríbenos a hola@vita.lat.'}
  }catch(e){msg.textContent='No pudimos cargar las horas. Recarga la página.'}
}
day.addEventListener('change',()=>{hours.innerHTML='';SEL='';go.disabled=true;
  SLOTS.filter(x=>x.day===day.value).forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.hour;
    b.addEventListener('click',()=>{hours.querySelectorAll('button').forEach(o=>o.classList.toggle('on',o===b));SEL=x.start;go.disabled=false;msg.textContent=''});hours.appendChild(b)})});
go.addEventListener('click',async()=>{
  EMAIL=(document.getElementById('email')?.value||EMAIL).trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(EMAIL)){document.getElementById('emailWrap').hidden=false;msg.textContent='Escribe tu email para confirmar.';return}
  if(!SEL){msg.textContent='Elige una hora.';return}
  go.disabled=true;go.textContent='Confirmando…';
  try{
    const r=await fetch(ENDPOINT,{method:'POST',body:JSON.stringify({form_id:'agenda-v1',email:EMAIL,fecha_reunion:SEL,origen:location.href})});
    const j=JSON.parse(await r.text());
    if(j.ok){document.getElementById('pick').hidden=true;document.getElementById('doneTxt').textContent=j.fecha;document.getElementById('done').hidden=false}
    else{msg.textContent=j.error||'No se pudo confirmar. Intenta otra hora.';go.disabled=false;go.textContent='Confirmar hora';load()}
  }catch(e){msg.textContent='Falló la conexión. Inténtalo de nuevo.';go.disabled=false;go.textContent='Confirmar hora'}
});
load();
</script></body></html>
